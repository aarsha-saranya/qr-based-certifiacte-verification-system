
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Certificate Verification</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e0e7ff, #f5f3ff);
        }
        .card {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 10px 35px #00000015;
        }
        h1 { text-align: center; color: #3730a3; }
        p { text-align: center; color: #64748b; }
        label { display: block; margin-top: 18px; }
        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
        }
        button {
            width: 100%;
            padding: 13px;
            margin-top: 24px;
            border: 0;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        a { color: #4f46e5; text-decoration: none; }
        .message { text-align: center; color: #b91c1c; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Welcome Back</h1>
        <p>Sign in to manage your certificates</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, message in messages %}
            <div class="message">{{ message }}</div>
          {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">
            <label for="email">Username or Email</label>
            <input id="email" type="text" name="email"
                   placeholder="Enter username or email" required>

            <label for="password">Password</label>
            <input id="password" type="password" name="password"
                   placeholder="Enter password" required>

            <button type="submit">Login</button>
        </form>

        <p>Don't have an account?
            <a href="{{ url_for('signup') }}">Create one</a>
        </p>

        <p><a href="{{ url_for('verify_certificate') }}">Verify a certificate</a></p>
    </div>
</body>
</html>
